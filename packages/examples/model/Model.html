<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/common.css" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
    <title>Model</title>
  </head>

  <style></style>

  <body>
    <div id="app"></div>

    <script type="module">
      import loadingTips from "../common/loadingTips.js";

      import * as THREE from "three";
      import { ModelingEngineSupport } from "@vis-three/engine-modeling-support";
      import {
        generateConfig,
        Template,
        globalAntiShake,
        CONFIGTYPE,
      } from "@vis-three/tdcm";

      window.test = {};

      const engine = new ModelingEngineSupport()
        .setDom(document.getElementById("app"))
        .setStats(true)
        .setSize()
        .play();

      generateConfig.injectEngine = engine;

      const scene = generateConfig("Scene");

      engine.setSceneBySymbol(scene.vid);

      generateConfig.injectScene = true;

      engine.loaderManager.setPath(import.meta.env.BASE_URL);

      generateConfig("AmbientLight", {
        intensity: 10,
      });

      const material = generateConfig("MeshStandardMaterial");

      const geometry = generateConfig("BoxGeometry", {
        width: 20,
        height: 20,
        depth: 20,
      });

      generateConfig("Mesh", {
        geometry: geometry.vid,
        material: material.vid,
      });

      generateConfig.autoInject = false;

      engine.loaderManager
        .getLoader("glb")
        .dracoLoader.setDecoderPath(import.meta.env.BASE_URL + "/draco/gltf/");

      engine.loadResourcesAsync(["model/glb/LittlestTokyo.glb"]).then((res) => {
        const model = generateConfig("LoadModel", {
          url: "model/glb/LittlestTokyo.glb.scene",
          position: {
            y: 30,
          },
          scale: {
            x: 0.1,
            y: 0.1,
            z: 0.1,
          },
        });

        engine.applyConfig(model);

        scene.children.push(model.vid);
      });
      console.log(engine);
      window.engine = engine;
    </script>
  </body>
</html>
